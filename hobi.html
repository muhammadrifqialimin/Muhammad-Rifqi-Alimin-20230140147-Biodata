<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobi Saya</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #000;
        color: white;
      }

      #hasilHobi {
        margin-top: 20px;
        padding: 15px;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      .hobi-item {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        gap: 15px;
      }

      .hobi-item input[type="checkbox"] {
        margin-right: 10px;
      }

      #hasilHobi ul {
        padding-left: 20px;
      }

      /* Style untuk ikon */
      .hobi-item i {
        font-size: 1.2em;
        width: 25px;
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hobi Saya</h1>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="biodata.html">Biodata</a>
        <a href="tentang.html">Tentang Saya</a>
        <a href="hobi.html">Hobi</a>
      </nav>
    </header>

    <main>
      <h2>Pilih Hobi Favorit Anda</h2>
      <form>
        <div class="hobi-item">
          <input type="checkbox" id="menulis" value="Menulis" />
          <i class="fas fa-pen"></i>
          <label for="menulis">Menulis</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="membaca" value="Membaca" />
          <i class="fas fa-book"></i>
          <label for="membaca">Membaca</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="ngoding" value="Ngoding" />
          <i class="fas fa-laptop-code"></i>
          <label for="ngoding">Ngoding</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="basket" value="Basket" />
          <i class="fas fa-basketball-ball"></i>
          <label for="basket">Basket</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="criket" value="Criket" />
          <i class="fas fa-baseball-ball"></i>
          <label for="criket">Criket</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="sepakbola" value="SepakBola" />
          <i class="fas fa-futbol"></i>
          <label for="sepakbola">Sepak Bola</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="memasak" value="Memasak" />
          <i class="fas fa-utensils"></i>
          <label for="memasak">Memasak</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="bermaingame" value="BermainGame" />
          <i class="fas fa-gamepad"></i>
          <label for="bermaingame">Bermain Game</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="musik" value="BermainMusik" />
          <i class="fas fa-guitar"></i>
          <label for="musik">Bermain Musik</label>
        </div>

        <input type="submit" value="Simpan" />
      </form>

      <div id="hasilHobi">
        <ul id="daftarHobi"></ul>
      </div>
    </main>

    <footer>

      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
