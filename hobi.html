<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobi Saya</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      #hasilHobi {
        margin-top: 20px;
        color: white;
      }

      .hobi-item {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      .hobi-item input[type="checkbox"] {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hobi Saya</h1>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="biodata.html">Biodata</a>
        <a href="tentang.html">Tentang Saya</a>
        <a href="hobi.html">Hobi</a>
      </nav>
    </header>

    <main>
      <h2>Pilih Hobi Favorit Anda</h2>
      <form onsubmit="tampilkanHobi(event)">
        <div class="hobi-item">
          <input type="checkbox" id="menulis" name="hobi" value="Menulis" />
          <label for="menulis">Menulis</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="membaca" name="hobi" value="Membaca" />
          <label for="membaca">Membaca</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="ngoding" name="hobi" value="Ngoding" />
          <label for="ngoding">Ngoding</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="basket" name="hobi" value="Basket" />
          <label for="basket">Basket</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="criket" name="hobi" value="Criket" />
          <label for="criket">Criket</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="sepakbola" name="hobi" value="SepakBola" />
          <label for="sepakbola">SepakBola</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="memasak" name="hobi" value="Memasak" />
          <label for="memasak">Memasak</label>
        </div>

        <div class="hobi-item">
          <input
            type="checkbox"
            id="bermaingame"
            name="hobi"
            value="BermainGame"
          />
          <label for="bermaingame">BermainGame</label>
        </div>

        <div class="hobi-item">
          <input type="checkbox" id="musik" name="hobi" value="Bermain Musik" />
          <label for="musik">Bermain Musik</label>
        </div>

        <input type="submit" value="Simpan" />
      </form>

      <div id="hasilHobi"></div>
    </main>

    <footer>© 2025 Muhammad Rifqi Alimin_20230140147</footer>

    <script>
      function tampilkanHobi(event) {
        event.preventDefault(); // mencegah form refresh halaman

        const checkboxes = document.querySelectorAll(
          'input[name="hobi"]:checked'
        );
        const hasilDiv = document.getElementById("hasilHobi");

        if (checkboxes.length === 0) {
          hasilDiv.innerHTML = "<p>Anda belum memilih hobi apa pun.</p>";
        } else {
          let hobiList = "<p>Hobi yang Anda pilih:</p><ul>";
          checkboxes.forEach((cb) => {
            hobiList += `<li>${cb.value}</li>`;
          });
          hobiList += "</ul>";
          hasilDiv.innerHTML = hobiList;
        }
      }
    </script>
  </body>
</html>
